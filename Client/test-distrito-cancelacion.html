<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: Distrito y Cancelación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Courier New', monospace; background: #1e1e1e; color: #fff; }
        .console { background: #000; padding: 15px; border-radius: 8px; margin: 20px 0; max-height: 500px; overflow-y: auto; font-size: 13px; }
        .log { margin: 3px 0; padding: 3px; }
        .log-info { color: #00d4ff; }
        .log-success { color: #00ff00; }
        .log-error { color: #ff4444; }
        .log-warn { color: #ffaa00; }
        .card { background: #2d2d2d; border-color: #444; }
        .btn { margin: 5px; }
        h1 { color: #ffaa00; }
        .test-item { padding: 10px; border-left: 3px solid #ffaa00; margin: 10px 0; }
        .test-pass { border-left-color: #00ff00; background: rgba(0,255,0,0.05); }
        .test-fail { border-left-color: #ff4444; background: rgba(255,68,68,0.05); }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1>🧪 Test: Distrito y Cancelación de Órdenes</h1>
    <p class="text-muted">Verifica que los cambios funcionen correctamente</p>

    <div class="row mb-4">
        <div class="col-md-6">
            <button class="btn btn-primary w-100" onclick="testDistrito()">
                🏘️ Test Distrito
            </button>
        </div>
        <div class="col-md-6">
            <button class="btn btn-danger w-100" onclick="testCancelacion()">
                ❌ Test Cancelación
            </button>
        </div>
    </div>

    <div class="console" id="console"></div>

    <div class="mt-4">
        <h3>Resultados:</h3>
        <div id="resultado"></div>
    </div>
</div>

<script>
const consoleDiv = document.getElementById('console');
const resultadoDiv = document.getElementById('resultado');

function log(mensaje, tipo = 'info') {
    const logEl = document.createElement('div');
    logEl.className = `log log-${tipo}`;
    
    let emoji = '📝';
    if (tipo === 'success') emoji = '✅';
    if (tipo === 'error') emoji = '❌';
    if (tipo === 'warn') emoji = '⚠️';
    if (tipo === 'info') emoji = 'ℹ️';
    
    logEl.textContent = `${emoji} ${mensaje}`;
    consoleDiv.appendChild(logEl);
    consoleDiv.scrollTop = consoleDiv.scrollHeight;
}

function clearConsole() {
    consoleDiv.innerHTML = '';
}

async function testDistrito() {
    clearConsole();
    log('Iniciando test de distrito...', 'info');
    resultadoDiv.innerHTML = '';
    
    try {
        // 1. Obtener órdenes del usuario
        log('1️⃣ Obteniendo órdenes del usuario...', 'info');
        
        // Primero necesitamos un token (fake para este test)
        const user = window.authManager?.getCurrentUser?.();
        if (!user) {
            log('❌ No hay usuario autenticado. Inicia sesión primero.', 'error');
            resultadoDiv.innerHTML = '<div class="alert alert-danger">Debes estar autenticado</div>';
            return;
        }

        // Obtener token
        const token = localStorage.getItem('supabaseAuthToken');
        if (!token) {
            log('❌ No hay token en localStorage', 'error');
            return;
        }

        // Llamar al API
        const res = await fetch('http://localhost:3000/api/orders/my-orders', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });

        if (!res.ok) {
            log(`❌ Error ${res.status}: ${res.statusText}`, 'error');
            return;
        }

        const data = await res.json();
        if (!data.success) {
            log(`❌ API error: ${data.error}`, 'error');
            return;
        }

        const orders = data.orders || [];
        if (orders.length === 0) {
            log('⚠️ No hay órdenes para analizar', 'warn');
            resultadoDiv.innerHTML = '<div class="alert alert-warning">Crea una orden primero</div>';
            return;
        }

        log(`✅ ${orders.length} órdenes encontradas`, 'success');

        // 2. Analizar el campo distrito
        log('2️⃣ Analizando campo distrito...', 'info');
        
        let distritosCorrecto = true;
        orders.forEach((order, i) => {
            const dist = order.distrito;
            if (dist && dist !== 'Lima') {
                log(`  Orden ${i+1}: Distrito = "${dist}" ✓`, 'success');
            } else {
                log(`  Orden ${i+1}: Distrito = "${dist || 'vacío'}" (esperado algo diferente)`, 'warn');
                if (!dist) distritosCorrecto = false;
            }
        });

        // 3. Resultado
        log('3️⃣ Verificando estructura...', 'info');
        const primerOrder = orders[0];
        const tieneDistrito = 'distrito' in primerOrder;
        
        if (tieneDistrito) {
            log(`✅ Campo 'distrito' existe en BD`, 'success');
        } else {
            log(`❌ Campo 'distrito' NO existe en BD`, 'error');
            distritosCorrecto = false;
        }

        // Mostrar resultado
        if (distritosCorrecto && tieneDistrito) {
            resultadoDiv.innerHTML = `
                <div class="test-item test-pass">
                    <h5>✅ Test Distrito PASADO</h5>
                    <p>El distrito se está guardando correctamente en la BD</p>
                    <code>${JSON.stringify(primerOrder, null, 2).substring(0, 200)}...</code>
                </div>
            `;
        } else {
            resultadoDiv.innerHTML = `
                <div class="test-item test-fail">
                    <h5>❌ Test Distrito FALLÓ</h5>
                    <p>Hay problemas con el guardado del distrito</p>
                </div>
            `;
        }

    } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        resultadoDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
    }
}

async function testCancelacion() {
    clearConsole();
    log('Iniciando test de cancelación...', 'info');
    resultadoDiv.innerHTML = '';
    
    try {
        // 1. Obtener órdenes
        log('1️⃣ Obteniendo órdenes para cancelar...', 'info');
        
        const user = window.authManager?.getCurrentUser?.();
        if (!user) {
            log('❌ No hay usuario autenticado', 'error');
            return;
        }

        const token = localStorage.getItem('supabaseAuthToken');
        if (!token) {
            log('❌ No hay token', 'error');
            return;
        }

        const res = await fetch('http://localhost:3000/api/orders/my-orders', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });

        const data = await res.json();
        const orders = data.orders || [];
        
        if (orders.length === 0) {
            log('⚠️ No hay órdenes para cancelar', 'warn');
            resultadoDiv.innerHTML = '<div class="alert alert-warning">Crea una orden primero</div>';
            return;
        }

        // 2. Intentar cancelar la primera orden "recibido"
        log('2️⃣ Buscando orden con estado "recibido"...', 'info');
        const orderToCancel = orders.find(o => o.estado === 'recibido');
        
        if (!orderToCancel) {
            log('⚠️ No hay órdenes en estado "recibido"', 'warn');
            resultadoDiv.innerHTML = '<div class="alert alert-warning">No hay órdenes que se puedan cancelar</div>';
            return;
        }

        log(`✅ Orden encontrada: ${orderToCancel.pedido_id}`, 'success');

        // 3. Intentar cancelar
        log('3️⃣ Intentando cancelar orden...', 'info');
        
        const cancelRes = await fetch(
            `http://localhost:3000/api/orders/${orderToCancel.pedido_id}/status`,
            {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nuevoEstado: 'cancelado' })
            }
        );

        if (!cancelRes.ok) {
            log(`❌ Error ${cancelRes.status}: ${cancelRes.statusText}`, 'error');
            const errorData = await cancelRes.json();
            log(`Error: ${errorData.error}`, 'error');
            resultadoDiv.innerHTML = `
                <div class="test-item test-fail">
                    <h5>❌ Test Cancelación FALLÓ</h5>
                    <p>Status: ${cancelRes.status}</p>
                    <p>Error: ${errorData.error}</p>
                </div>
            `;
            return;
        }

        const cancelData = await cancelRes.json();
        if (!cancelData.success) {
            log(`❌ API error: ${cancelData.error}`, 'error');
            return;
        }

        log(`✅ Orden cancelada exitosamente`, 'success');

        resultadoDiv.innerHTML = `
            <div class="test-item test-pass">
                <h5>✅ Test Cancelación PASADO</h5>
                <p>La orden se canceló correctamente</p>
                <p>Orden ID: ${orderToCancel.pedido_id}</p>
                <p>Nuevo estado: ${cancelData.order.estado}</p>
            </div>
        `;

    } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        resultadoDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
    }
}
</script>
</body>
</html>
