<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Restaurante - RapiRush</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="../index.html">
              <h3>🚚 RapiRush</h3>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5"></i>
                            <span id="userName">Restaurante</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="logout()">Cerrar sesión</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <!-- Título -->
            <div class="col-12">
                <h2 class="mb-4">📊 Dashboard Restaurante</h2>
                <div id="alertContainer"></div>
            </div>

            <!-- Tabs de Pedidos -->
            <div class="col-12">
                <ul class="nav nav-tabs mb-4" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="aceptados-tab" data-bs-toggle="tab" data-bs-target="#aceptados" type="button" role="tab">
                            ✅ Aceptados <span id="aceptadosCount" class="badge bg-success ms-2">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="preparando-tab" data-bs-toggle="tab" data-bs-target="#preparando" type="button" role="tab">
                            👨‍🍳 Preparando <span id="preparandoCount" class="badge bg-warning ms-2">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="listos-tab" data-bs-toggle="tab" data-bs-target="#listos" type="button" role="tab">
                            📋 Listos <span id="listosCount" class="badge bg-danger ms-2">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="productos-tab" data-bs-toggle="tab" data-bs-target="#productos" type="button" role="tab">
                            📦 Mis Productos
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- listos -->
                    <div class="tab-pane fade show active" id="listos" role="tabpanel">
                        <div id="listosContainer" class="row">
                            <div class="col-12 text-center text-muted py-5">
                                <i class="bi bi-inbox fs-1"></i>
                                <p>No hay pedidos listos</p>
                            </div>
                        </div>
                    </div>

                    <!-- Aceptados -->
                    <div class="tab-pane fade" id="aceptados" role="tabpanel">
                        <div id="aceptadosContainer" class="row">
                            <div class="col-12 text-center text-muted py-5">
                                <i class="bi bi-inbox fs-1"></i>
                                <p>No hay pedidos aceptados</p>
                            </div>
                        </div>
                    </div>

                    <!-- Preparando -->
                    <div class="tab-pane fade" id="preparando" role="tabpanel">
                        <div id="preparandoContainer" class="row">
                            <div class="col-12 text-center text-muted py-5">
                                <i class="bi bi-inbox fs-1"></i>
                                <p>No hay pedidos preparando</p>
                            </div>
                        </div>
                    </div>

                    <!-- Productos -->
                    <div class="tab-pane fade" id="productos" role="tabpanel">
                        <div class="row">
                            <div class="col-12 mb-4">
                                <button class="btn btn-primary" onclick="showAddProductForm()">
                                    <i class="bi bi-plus-lg"></i> Agregar Producto
                                </button>
                            </div>
                            <div id="productosContainer" class="col-12">
                                <div class="text-center text-muted py-5">
                                    <i class="bi bi-inbox fs-1"></i>
                                    <p>No hay productos cargados</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalles Pedido -->
    <div class="modal fade" id="orderDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">📦 Detalles del Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="orderDetailBody">
                    <!-- Contenido dinámico -->
                </div>
                <div class="modal-footer" id="orderDetailFooter">
                    <!-- Botones dinámicos -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Producto -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">➕ Agregar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Producto *</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="productDesc" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría *</label>
                            <select class="form-control" id="productCategory" required>
                                <option value="">Selecciona una categoría</option>
                                <option value="Pizzas">Pizzas</option>
                                <option value="Hamburguesas">Hamburguesas</option>
                                <option value="Bebidas">Bebidas</option>
                                <option value="Complementos">Complementos</option>
                                <option value="Pasteles">Pasteles</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio Base *</label>
                            <input type="number" class="form-control" id="productPrice" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL de Imagen</label>
                            <input type="url" class="form-control" id="productImage" placeholder="https://ejemplo.com/imagen.jpg">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="submitAddProduct()">Agregar Producto</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api/rapiRushAPI.js"></script>
    <script src="../assets/js/api/cache.js"></script>
    <script>
        // Variables globales
        let restauranteOrders = [];
        let restauranteId;
        let restauranteName;
        let userRole;

        // ✅ ESPERAR A QUE EL DOM ESTÉ LISTO ANTES DE VERIFICAR
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('📋 restaurante.html - DOMContentLoaded iniciado');
            console.log('⏱️ Timestamp:', new Date().toISOString());
            
            // ✅ ESPERAR a que authManager esté listo
            if (window.authManager && typeof window.authManager.isReady === 'function') {
                await window.authManager.isReady();
                console.log('✅ authManager está listo');
            }
            
            // ✅ PEQUEÑO DELAY PARA ASEGURAR QUE sessionStorage ESTÉ SINCRONIZADO
            setTimeout(() => {
                console.log('🔍 sessionStorage actual:', {
                    user_id: sessionStorage.getItem('user_id'),
                    user_name: sessionStorage.getItem('user_name'),
                    user_role: sessionStorage.getItem('user_role'),
                    user_email: sessionStorage.getItem('user_email')
                });
                
                console.log('💾 localStorage actual:', {
                    supabaseAuthToken: !!localStorage.getItem('supabaseAuthToken'),
                    currentUser: !!localStorage.getItem('currentUser')
                });

                restauranteId = sessionStorage.getItem('user_id');
                restauranteName = sessionStorage.getItem('user_name');
                userRole = sessionStorage.getItem('user_role');

                console.log('📍 Valores extraídos:', {
                    restauranteId,
                    restauranteName,
                    userRole
                });

                // Verificar autenticación - AHORA DENTRO DE DOMContentLoaded
                if (!restauranteId || userRole !== 'restaurante') {
                    console.error('❌ Autenticación fallida. Redirigiendo a login...');
                    console.error('Detalles:', {
                        restauranteId_exists: !!restauranteId,
                        restauranteId_value: restauranteId,
                        userRole_value: userRole,
                        userRole_matches: userRole === 'restaurante',
                        typeof_userRole: typeof userRole
                    });
                    window.location.href = '../auth/login.html';
                    return; // ✅ IMPORTANTE: Detener ejecución del resto del script
                }

                console.log('✅ Autenticación verificada. Restaurante ID:', restauranteId);
                document.getElementById('userName').textContent = restauranteName || 'Restaurante';

                // Cargar datos del restaurante
                loadOrders();
            }, 100); // 100ms de delay para sincronización
        });

        // Cargar pedidos del restaurante

        async function loadOrders() {
        try {
            const token = localStorage.getItem('supabaseAuthToken');
            if (!token) throw new Error('No autenticado');

            const response = await fetch('/api/orders/restaurant/' + restauranteId, {
            headers: { 'Authorization': `Bearer ${token}` }
            });

            console.log('🔎 Status:', response.status);

            if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || `Error ${response.status} al cargar pedidos`);
            }

            const data = await response.json();
            restauranteOrders = data.orders || [];
            console.log('📦 Pedidos del restaurante:', restauranteOrders);

            renderOrders();
        } catch (error) {
            console.error('❌ Error:', error);
            showAlert(error.message, 'danger'); // 👈 ya no concatenamos dos veces
        }
        }

        // Renderizar pedidos por estado
        function renderOrders() {
            const aceptados = restauranteOrders.filter(o => o.status === 'aceptado');
            const preparando = restauranteOrders.filter(o => o.status === 'preparando');
            const listos = restauranteOrders.filter(o => o.status === 'listo');

            // Actualizar contadores
            document.getElementById('listosCount').textContent = listos.length;
            document.getElementById('aceptadosCount').textContent = aceptados.length;
            document.getElementById('preparandoCount').textContent = preparando.length;

            // Renderizar cada grupo
            renderOrderGroup('listosContainer', listos, 'pendiente');
            renderOrderGroup('aceptadosContainer', aceptados, 'aceptado');
            renderOrderGroup('preparandoContainer', preparando, 'preparando');
        }

        function renderOrderGroup(containerId, orders, status) {
            const container = document.getElementById(containerId);
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center text-muted py-5">
                        <i class="bi bi-inbox fs-1"></i>
                        <p>No hay pedidos en estado: ${status}</p>
                    </div>`;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="col-md-6 mb-4">
                    <div class="card border-left border-primary">
                        <div class="card-body">
                            <h6 class="card-title">
                                <strong>Pedido #${order.id.toString().slice(-6)}</strong>
                                <span class="badge ${getStatusBadgeClass(order.status)}">${order.status}</span>
                            </h6>
                            <p class="mb-2"><strong>Cliente:</strong> ${order.cliente_nombre || 'N/A'}</p>
                            <p class="mb-2"><strong>Dirección:</strong> ${order.delivery_address || 'N/A'}</p>
                            <p class="mb-2"><strong>Total:</strong> S/. ${(order.total || 0).toFixed(2)}</p>
                            <p class="mb-3"><strong>Items:</strong> ${order.item_count || 0} productos</p>
                            <button class="btn btn-sm btn-info" onclick="showOrderDetail(${order.id})">
                                Ver Detalles
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getStatusBadgeClass(status) {
            const classes = {
                'pendiente': 'bg-warning text-dark',
                'aceptado': 'bg-success',
                'preparando': 'bg-info'
            };
            return classes[status] || 'bg-secondary';
        }

        // ✅ CARGAR PRODUCTOS DEL RESTAURANTE
        async function loadProducts() {
            try {
                const token = localStorage.getItem('supabaseAuthToken');
                if (!token) return;

                const response = await fetch(`http://localhost:3000/api/products?restaurant_id=${restauranteId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!response.ok) throw new Error('Error al cargar productos');
                
                const data = await response.json();
                const products = data.data || data.products || [];
                console.log('📦 Productos del restaurante:', products);
                
                renderProducts(products);
            } catch (error) {
                console.error('❌ Error cargando productos:', error);
            }
        }

        // ✅ RENDERIZAR PRODUCTOS
        function renderProducts(products) {
            const container = document.getElementById('productosContainer');
            
            if (!products || products.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center text-muted py-5">
                        <i class="bi bi-inbox fs-1"></i>
                        <p>No hay productos registrados</p>
                    </div>`;
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">${product.nombre}</h5>
                            <p class="card-text text-muted small">${product.descripcion || 'Sin descripción'}</p>
                            <p class="mb-2"><strong>Categoría:</strong> ${product.categoria || 'N/A'}</p>
                            <p class="mb-3"><strong>Precio:</strong> S/. ${(product.base_price || 0).toFixed(2)}</p>
                            <button class="btn btn-sm btn-warning" onclick="editProduct(${product.id})">Editar</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${product.id})">Eliminar</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Mostrar detalles del pedido
        async function showOrderDetail(orderId) {
            try {
                const token = localStorage.getItem('supabaseAuthToken');
                if (!token) throw new Error('No autenticado');

                const response = await fetch('/api/orders/' + orderId, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!response.ok) throw new Error('Error al cargar detalles');
                
                const data = await response.json();
                const order = data.order || data;
                const modal = new bootstrap.Modal(document.getElementById('orderDetailModal'));
                
                // Renderizar detalles
                const detailBody = document.getElementById('orderDetailBody');
                let html = `
                    <div class="mb-3">
                        <h6 class="text-primary">📋 Información del Pedido</h6>
                        <p class="mb-1"><strong>Cliente:</strong> ${order.cliente_nombre || 'N/A'}</p>
                        <p class="mb-1"><strong>Teléfono:</strong> ${order.cliente_telefono || 'N/A'}</p>
                        <p class="mb-3"><strong>Estado:</strong> <span class="badge ${getStatusBadgeClass(order.status)}">${order.status}</span></p>
                    </div>
                    
                    <div class="mb-3">
                        <h6 class="text-primary">🏠 Entrega</h6>
                        <p class="mb-1"><strong>Dirección:</strong> ${order.delivery_address || 'N/A'}</p>
                        <p class="mb-1"><strong>Distrito:</strong> ${order.district || 'N/A'}</p>
                        ${order.referencia_entrega ? `<p class="mb-1"><strong>Referencia:</strong> ${order.referencia_entrega}</p>` : ''}
                        ${order.nota_repartidor ? `<p class="mb-3"><strong>Nota:</strong> <em>"${order.nota_repartidor}"</em></p>` : ''}
                    </div>
                    
                    <div class="mb-3">
                        <h6 class="text-primary">📦 Items</h6>
                        <div class="list-group">`;
                
                // Agregar items
                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        html += `
                            <div class="list-group-item">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h6 class="mb-0">${item.name}</h6>
                                        <small class="text-muted">${item.quantity}x ${item.description || ''}</small>
                                    </div>
                                    <span class="fw-bold">S/. ${(item.price * item.quantity).toFixed(2)}</span>
                                </div>
                            </div>`;
                    });
                }
                
                html += `</div></div><div class="mb-3"><strong>Total:</strong> S/. ${(order.total || 0).toFixed(2)}</div>`;
                
                detailBody.innerHTML = html;

                // Renderizar botones de acción
                const footer = document.getElementById('orderDetailFooter');
                footer.innerHTML = '';

                if (order.status === 'pendiente') {
                    footer.innerHTML += `
                        <button type="button" class="btn btn-success" onclick="updateOrderStatus(${orderId}, 'aceptado')">
                            ✅ Aceptar Pedido
                        </button>
                        <button type="button" class="btn btn-danger" onclick="updateOrderStatus(${orderId}, 'rechazado')">
                            ❌ Rechazar
                        </button>`;
                } else if (order.status === 'aceptado') {
                    footer.innerHTML += `
                        <button type="button" class="btn btn-warning" onclick="updateOrderStatus(${orderId}, 'preparando')">
                            👨‍🍳 Marcar Preparando
                        </button>`;
                } else if (order.status === 'preparando') {
                    footer.innerHTML += `
                        <button type="button" class="btn btn-info" onclick="updateOrderStatus(${orderId}, 'en_camino')">
                            ✨ Marcar Listo para Entrega
                        </button>`;
                }

                footer.innerHTML += `<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>`;

                modal.show();
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert('Error: ' + error.message, 'danger');
            }
        }

        // Actualizar estado del pedido
        async function updateOrderStatus(orderId, newStatus) {
            if (!confirm(`¿Cambiar estado a "${newStatus}"?`)) return;

            try {
                const token = localStorage.getItem('supabaseAuthToken');
                if (!token) throw new Error('No autenticado');

                console.log('📝 Actualizando estado:', { orderId, newStatus, token: token.substring(0, 20) + '...' });

                const response = await fetch(`http://localhost:3000/api/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ estado: newStatus })
                });

                const data = await response.json();
                console.log('📥 Respuesta:', data);

                if (!response.ok) throw new Error(data.error || 'Error al actualizar');

                showAlert(`✅ Pedido actualizado a: ${newStatus}`, 'success');
                bootstrap.Modal.getInstance(document.getElementById('orderDetailModal')).hide();
                
                // Recargar pedidos
                await loadOrders();
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert('Error: ' + error.message, 'danger');
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.appendChild(alertDiv);

            setTimeout(() => alertDiv.remove(), 5000);
        }

        function logout() {
            if (confirm('¿Cerrar sesión?')) {
                sessionStorage.clear();
                localStorage.removeItem('user_email');
                window.location.href = '../auth/login.html';
            }
        }

        // Cargar pedidos y productos al iniciar
        loadOrders();
        loadProducts();
        // Recargar cada 10 segundos
        setInterval(() => {
            loadOrders();
            loadProducts();
        }, 10000);

        // ✅ FUNCIONES PARA PRODUCTOS
        function showAddProductForm() {
            const modal = new bootstrap.Modal(document.getElementById('addProductModal'));
            modal.show();
        }

        function editProduct(productId) {
            console.log('✏️ Editar producto:', productId);
            showAlert('Funcionalidad de edición en desarrollo', 'info');
        }

        function deleteProduct(productId) {
            if (!confirm('¿Eliminar este producto?')) return;
            console.log('🗑️ Eliminar producto:', productId);
            showAlert('Funcionalidad de eliminación en desarrollo', 'info');
        }

        async function submitAddProduct() {
            const producto = {
                nombre: document.getElementById('productName').value.trim(),
                descripcion: document.getElementById('productDesc').value.trim(),
                categoria: document.getElementById('productCategory').value,
                base_price: parseFloat(document.getElementById('productPrice').value),
                image_url: document.getElementById('productImage').value.trim(),
                sizes: [] // Por ahora sin tamaños
            };

            if (!producto.nombre || !producto.categoria || !producto.base_price) {
                showAlert('Por favor completa los campos obligatorios (*)', 'danger');
                return;
            }

            try {
                const token = localStorage.getItem('supabaseAuthToken');
                if (!token) throw new Error('No autenticado');

                console.log('📤 Enviando producto:', producto);
                console.log('🔐 Token:', token.substring(0, 20) + '...');

                const response = await fetch('http://localhost:3000/api/products/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(producto)
                });

                const data = await response.json();
                console.log('📥 Respuesta:', data);

                if (!response.ok) {
                    throw new Error(data.error || 'Error al crear producto');
                }

                showAlert('✅ Producto creado exitosamente', 'success');
                bootstrap.Modal.getInstance(document.getElementById('addProductModal')).hide();
                document.getElementById('addProductForm').reset();

                // Recargar productos (si los implementamos después)
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert('Error: ' + error.message, 'danger');
            }
        }
    </script>
</body>
</html>
